[package]
title = "Crowd Agents"
version = "0.1.1"
description = "Intent-driven crowd simulation for venues: agents, navigation, fire response, and decision engine."
category = "Simulation"
changelog = "docs/CHANGELOG.md"
keywords = ["kit", "crowd", "agents", "simulation", "navigation"]
readme = "docs/README.md"
repository = "https://github.com/NVIDIA-Omniverse/kit-app-template"


[dependencies]
"omni.kit.uiapp" = {}
"omni.usd" = {}
"omni.anim.navigation.core" = {}
"omni.kit.viewport.utility" = {}
"omni.kit.viewport.window" = {}
"omni.kit.raycast.query" = {}
"omni.kit.mesh.raycast" = {}
"omni.kit.window.stage" = { optional = true }
"omni.kit.window.property" = { optional = true }
"omni.rtx.window.settings" = { optional = true }


[settings]
exts."crowd.agents".layout.enabled = true
exts."omni.kit.mesh.raycast".bvhBuildOnFirstRequired = true


[[python.module]]
name = "crowd.agents"


[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]


[[test]]
dependencies = [
    "omni.kit.test",
    "omni.kit.ui_test"
]

args = [
]
